<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل لاگین</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <!-- ===== هدر ===== -->
        <div class="login-header">
          <h1>صفحه ورود</h1>
        </div>
        <!-- <div
            class="divider"
            style="
              width: 100%;
              height: 2px;
              background: var(--border-color);
              margin: 0.8rem 0 1.5rem 0;
              border-radius: 4px;
              position: relative;
            "
          ></div> -->
        <form class="login-form" id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">نام کاربری:</label>

            <div class="input-wrapper">
              <input
                type="text"
                placeholder="نام کاربری"
                id="username"
                autocomplete="current-password"
                required
              />
              <!-- حداقل و حداکثر  برای نام کار بری هنوز تعریف نشده -->
            </div>
            <div class="form-error" id="usernameError">
              <span>لطفاً نام کاربری را وارد کنید</span>
            </div>
          </div>
          <div class="form-group">
            <label for="password">رمز عبور:</label>
            <div class="input-wrapper">
              <input
                type="password"
                name="password"
                id="password"
                placeholder="رمز عبور"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                title="نمایش/مخفی کردن رمز"
                aria-label="نمایش یا مخفی کردن رمز عبور"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="form-error" id="passwordError">
              <span>لطفاً رمز عبور را وارد کنید</span>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">
            ورود
          </button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast">
      <span id="toastMessage">عملیات موفق</span>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
